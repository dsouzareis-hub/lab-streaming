# Kids Stream - VirtualHost (instalado por install.sh em /etc/apache2/sites-available/)
<VirtualHost *:80>
    ServerName kidsstream.lab
    ServerAlias *
    DocumentRoot @APP_DIR@/public

    <Directory @APP_DIR@/public>
        Options -Indexes -ExecCGI -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>

    # Uploads nunca são executados como código
    <Directory @APP_DIR@/public/uploads>
        php_admin_flag engine off
        RemoveHandler .php .phtml .php3 .php4 .php5 .phar
        RemoveType .php .phtml .php3 .php4 .php5 .phar
        Options -ExecCGI -Indexes
        FallbackResource disabled
        <FilesMatch "(?i)\.(php|phtml|phar|pht|sh|cgi|pl|py)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Somente /index.php é executável na raiz pública
    <FilesMatch "\.php$">
        Require all denied
    </FilesMatch>
    <Files "index.php">
        Require all granted
    </Files>

    # Nada além do necessário
    <DirectoryMatch "/\.">
        Require all denied
    </DirectoryMatch>

    ErrorLog ${APACHE_LOG_DIR}/kidsstream-error.log
    CustomLog ${APACHE_LOG_DIR}/kidsstream-access.log combined
    LimitRequestBody 3145728
</VirtualHost>
