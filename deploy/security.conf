# Hardening do Apache (instalado em conf-available/kidsstream-security.conf)
ServerTokens Prod
ServerSignature Off
TraceEnable Off
FileETag None
Timeout 30
KeepAliveTimeout 3
LimitRequestFields 50
LimitRequestFieldSize 8190
LimitRequestLine 4094

<IfModule mod_headers.c>
    Header always unset X-Powered-By
    Header always set X-Content-Type-Options "nosniff"
</IfModule>
