; Hardening do PHP (instalado em conf.d do apache2 SAPI)
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
html_errors = Off
allow_url_include = Off
allow_url_fopen = On
file_uploads = On
upload_max_filesize = 2M
post_max_size = 3M
max_execution_time = 15
memory_limit = 64M
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_strict_mode = 1
session.use_only_cookies = 1
session.sid_length = 48
session.gc_maxlifetime = 3600
disable_functions = exec,passthru,shell_exec,system,proc_open,popen,pcntl_exec,dl,show_source,highlight_file
open_basedir = @APP_DIR@:/tmp:/var/lib/php/sessions:/usr/share/php
